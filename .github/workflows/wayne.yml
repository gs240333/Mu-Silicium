name: Build UEFI for wayne

on:
  push:
    branches: ["main"]
    paths:
      - 'Platforms/Xiaomi/waynePkg/**'
      - 'Resources/Configs/wayne.toml'
      - 'Resources/DTBs/wayne.dtb'
      - 'BootShim/**'
      - '.github/workflows/wayne.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CI_BUILD: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: bash ./setup_env.sh -p apt

      - name: Build UniXNU package
        run: |
          git submodule update --init --depth 1 Mu_Basecore
          ( cd Mu_Basecore && git submodule update --init --depth 1 \
              MdePkg/Library/BaseFdtLib/libfdt \
              MdePkg/Library/MipiSysTLib/mipisyst \
              BaseTools/Source/C/BrotliCompress/brotli )
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git /tmp/UniXNU
          ( cd /tmp/UniXNU && echo "UniXNU revision: $(git rev-parse HEAD)" )
          UNIXNU_EDK2="$PWD/Mu_Basecore" bash /tmp/UniXNU/package/build.sh -b RELEASE -t CLANGPDB
          # The platform DSC refers to UniXNUPkg/..., so the package has to be
          # visible under one of the PACKAGES_PATH entries this platform lists.
          cp -r /tmp/UniXNU/package/UniXNUPkg Platforms/Xiaomi/UniXNUPkg
          ls Platforms/Xiaomi/UniXNUPkg
          # DarwinBoot is the firmware side of the xnu payload entry.
          git clone -q https://github.com/UniXNU/DarwinBoot.git /tmp/DarwinBoot
          ( cd /tmp/DarwinBoot && git checkout -q 3325e352d7df68a9f9ad74832ed94a6acbbd7390 && echo "DarwinBoot revision: $(git rev-parse HEAD)" )
          cp -r /tmp/DarwinBoot/DarwinBootPkg Platforms/Xiaomi/DarwinBootPkg
          ls Platforms/Xiaomi/DarwinBootPkg Platforms/Xiaomi/DarwinBootPkg/Driver

      - name: Build UEFI for wayne
        run: ./build_uefi.py -d wayne -r RELEASE -c

      - name: Upload UEFI image
        uses: actions/upload-artifact@v4
        with:
          name: wayne-uefi
          path: |
            Mu-wayne.img
            Build/waynePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
            /tmp/UniXNU/Build/Out/AARCH64-RELEASE/*.efi
          if-no-files-found: warn
          compression-level: 9

      # The device repository packs the payload into this firmware volume. A
      # public release asset keeps that step free of cross-repository tokens.
      - name: Publish the firmware volume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp Build/waynePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd dist/
          cp Mu-wayne.img dist/
          ( cd dist && sha256sum * > SHA256SUMS )
          gh release view wayne-latest >/dev/null 2>&1 || \
            gh release create wayne-latest --title "wayne UEFI (latest)" --notes "Firmware volume and boot image built from the current main."
          gh release upload wayne-latest dist/* --clobber

