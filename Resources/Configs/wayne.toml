#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# Copied from Mu-Silicium's lavender.toml (Redmi Note 7, same SDM660). Verify against
# the stock wayne boot.img before trusting it: the ABL on 2018 devices may map the
# FV differently, and REQURES_KERNEL_HEADER depends on the ABL's image header check.
[uefi_fd]
base = 0x9FC00000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
# MEASURE: unpack the stock boot.img and read its header. lavender uses header_version
# 1; wayne may require 0. `unpack_bootimg`/`mkbootimg` in the AOSP tree, or
# `python3 Resources/Scripts/mkbootimg.py --help` for the parser the firmware uses.
[boot_image]
header_version = 1
base           = 0x00000000
kernel_offset  = 0x00008000
tags_offset    = 0x01e00000
pagesize       = 4096
